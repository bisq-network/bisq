import org.yaml.snakeyaml.DumperOptions
import org.yaml.snakeyaml.LoaderOptions
import org.yaml.snakeyaml.Yaml
import org.yaml.snakeyaml.constructor.SafeConstructor
import org.yaml.snakeyaml.nodes.Tag
import org.yaml.snakeyaml.representer.Representer
import org.yaml.snakeyaml.resolver.Resolver

buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.yaml:snakeyaml:2.6' }
}

// Outside contributors cannot trigger these events with secrets or a write token. Every other
// event, for example pull_request_target, workflow_run, issues or issue_comment, runs in the
// base repository context and needs a reviewed workflow.
def unprivilegedTriggers = ['push', 'pull_request', 'schedule', 'workflow_dispatch', 'workflow_call']

// These workflows intentionally handle privileged events. Review changes to their jobs and
// permissions before updating the SHA-256 of the LF-normalized workflow.
def reviewedWorkflows = [
        'contribution-notice.yml': '5984d047180f22c6a7ab44c65613a313be0860c2ec167ac6865578e26f0b1cf7'
]

// GitHub resolves plain scalars with the YAML 1.2 core schema. The YAML 1.1 default of SnakeYAML reads on, yes or
// off as booleans, so it would accept validate-wrappers: yes and merge distinct keys such as ON and YES. The policy
// reads no numbers, so every other plain scalar stays a string.
class GithubScalarResolver extends Resolver {
    @Override
    protected void addImplicitResolvers() {
        addImplicitResolver(Tag.BOOL, ~/^(?:true|True|TRUE|false|False|FALSE)$/, 'tTfF')
        addImplicitResolver(Tag.NULL, ~/^(?:|~|null|Null|NULL)$/, '~nN\u0000')
    }
}

def workflows = fileTree('.github/workflows') { include '*.yml', '*.yaml' }
tasks.named('verifyGithubActionsSecurity') {
    inputs.files(workflows)
    doLast {
        def violations = []
        def options = new LoaderOptions()
        options.allowDuplicateKeys = false
        def dumperOptions = new DumperOptions()
        def yaml = new Yaml(new SafeConstructor(options), new Representer(dumperOptions), dumperOptions, options,
                new GithubScalarResolver())
        workflows.files.sort().each { file ->
            def text = file.getText('UTF-8').replace('\r\n', '\n')
            def workflow = yaml.load(text)
            if (workflow.permissions == null) {
                violations << "${file.name}: declare top-level permissions"
            }

            def events = workflow.on
            def triggers = events instanceof Map ? events.keySet() : (events instanceof List ? events : [events])
            def digest = text.digest('SHA-256')
            if (triggers.any { !(it in unprivilegedTriggers) } && digest != reviewedWorkflows[file.name]) {
                violations << "${file.name}: privileged trigger requires a reviewed workflow digest, current ${digest}"
            }

            workflow.jobs.each { jobName, job ->
                job.steps?.each { step ->
                    // GitHub resolves action names and input names regardless of case.
                    def uses = step.uses?.toString()?.toLowerCase()
                    def inputs = step.with
                    // An expression as the inputs or as an input name hides which input a step sets.
                    if (inputs != null && !(inputs instanceof Map) ||
                            inputs instanceof Map && inputs.keySet().any { it?.toString()?.contains('${{') }) {
                        violations << "${file.name}: ${jobName}: use literal action input names"
                    }
                    def input = { name ->
                        inputs instanceof Map ? inputs.findAll { it.key?.toString()?.equalsIgnoreCase(name) }.values() : []
                    }
                    // Expressions expand into the script text before it runs. Pass them through env instead.
                    def scripts = uses?.startsWith('actions/github-script@') ? input('script') : []
                    if (([step.run] + scripts).any { it?.toString()?.contains('${{') }) {
                        violations << "${file.name}: ${jobName}: pass expressions through env in run and script steps"
                    }
                    def validateWrappers = input('validate-wrappers')
                    if (uses?.startsWith('gradle/actions/setup-gradle@') &&
                            (validateWrappers.empty || validateWrappers.any { it?.toString() != 'true' })) {
                        violations << "${file.name}: ${jobName}: enable validate-wrappers on setup-gradle"
                    }
                }
            }
        }
        if (violations) {
            throw new GradleException(violations.join('\n'))
        }
    }
}
