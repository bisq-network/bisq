import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Apply to each owning project: a root task must not resolve another project's configurations.
def owningProject = project
def inventoryFile = layout.projectDirectory.file('.gradle/dependency-verification/project-inventory.tsv')

tasks.register('resolveProjectDependencies') {
    group = 'verification'
    description = "Resolves this project's configurations and records their dependency inventory."
    notCompatibleWithConfigurationCache('Resolves project configurations at execution time')
    outputs.file(inventoryFile)
    outputs.upToDateWhen { false }

    doLast {
        def configurations = (owningProject.configurations + owningProject.buildscript.configurations)
                .findAll { it.canBeResolved }.sort { it.name }
        def resolvedComponents = new TreeSet<String>()
        def directComponents = new TreeSet<String>()
        def failures = []
        configurations.each { configuration ->
            try {
                def result = configuration.incoming.resolutionResult
                result.root.dependencies.each { dependency ->
                    def selected = dependency.hasProperty('selected') ? dependency.selected?.id : null
                    if (selected instanceof ModuleComponentIdentifier) {
                        directComponents.add("${selected.group}:${selected.module}:${selected.version}".toString())
                    }
                }
                result.allComponents.each { component ->
                    def id = component.id
                    if (id instanceof ModuleComponentIdentifier) {
                        resolvedComponents.add("${id.group}:${id.module}:${id.version}".toString())
                    }
                }
                configuration.resolve()
            } catch (Exception exception) {
                failures << "${owningProject.path}:${configuration.name} - ${exception.message}"
            }
        }
        if (!failures.empty) {
            throw new GradleException("Failed to resolve ${failures.size()} configuration(s):\n - ${failures.join('\n - ')}")
        }

        def output = inventoryFile.asFile
        output.parentFile.mkdirs()
        def lines = ["configurations\t${configurations.size()}".toString()] + resolvedComponents.collect { id ->
            "${directComponents.contains(id) ? 'direct' : 'transitive'}\t${id}".toString()
        }
        output.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}
