plugins {
    id 'bisq.application'
    id 'bisq.javafx'
    id 'bisq.gradle.app_start_plugin.AppStartPlugin'
    id 'bisq.gradle.packaging.PackagingPlugin'
}

application {
    mainClass = 'bisq.desktop.app.BisqAppMain'
    applicationDefaultJvmArgs = ['-XX:MaxRAMPercentage=50', '-XX:+UseCompressedOops', '-Xss1280k', '-XX:+UseG1GC',
                                 '-XX:MaxHeapFreeRatio=10', '-XX:MinHeapFreeRatio=5', '-XX:+UseStringDeduplication',
                                 '-Djava.net.preferIPv4Stack=true',
                                 '--add-opens=javafx.controls/javafx.scene.control.skin=ALL-UNNAMED']
}

javafx {
    modules = ['javafx.controls', 'javafx.fxml']
}

sourceSets.main.resources.srcDirs += ['src/main/java'] // to copy fxml and css files
distTar.enabled = true // Needed for RPM build

dependencies {
    implementation enforcedPlatform(project(':platform'))
    implementation project(':assets')
    implementation project(':common')
    implementation project(':proto')
    implementation project(':p2p')
    implementation project(':core')
    annotationProcessor libs.lombok
    compileOnly libs.lombok
    implementation libs.logback.classic
    implementation libs.logback.core
    implementation libs.google.gson
    implementation libs.google.guava
    implementation libs.jcsv
    implementation libs.commons.io
    implementation libs.zxing.core
    implementation libs.apache.commons.lang3
    implementation libs.bouncycastle.bcpg.jdk18on
    implementation libs.fxmisc.easybind
    implementation libs.jetbrains.annotations
    implementation libs.slf4j.api
    implementation(libs.bitcoinj) {
        exclude(module: 'bcprov-jdk15on')
        exclude(module: 'guava')
        exclude(module: 'jsr305')
        exclude(module: 'okhttp')
        exclude(module: 'okio')
        exclude(module: 'slf4j-api')
    }
    implementation(libs.google.guice) {
        exclude(module: 'guava')
    }
    testAnnotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testImplementation libs.natpryce.make.it.easy
}

test {
    systemProperty 'jdk.attach.allowAttachSelf', true
}

def registerAppTask(String taskName, String nodePort, String dataDir, String appName, boolean isFullNode = false) {
    tasks.register(taskName, JavaExec) {
        group = 'application'
        dependsOn ':initialDaoSetup'

        classpath = sourceSets.main.runtimeClasspath
        mainClass = application.mainClass
        jvmArgs = application.applicationDefaultJvmArgs
        workingDir = rootProject.projectDir

        def taskArgs = [
            "--baseCurrencyNetwork=BTC_REGTEST",
            "--useLocalhostForP2P=true",
            "--useDevPrivilegeKeys=true",
            "--nodePort=$nodePort",
            "--appDataDir=$dataDir",
            "--appName=$appName"
        ]

        if (isFullNode) {
            taskArgs += [
                "--fullDaoNode=true",
                "--isBmFullNode=true",
                "--rpcUser=bisqdao",
                "--rpcPassword=bsq",
                "--rpcBlockNotificationPort=5122",
                "--genesisBlockHeight=111",
                "--genesisTxId=30af0050040befd8af25068cc697e418e09c2d8ebd8d411d2240591b9ec203cf"
            ]
        }

        args = taskArgs
    }
}

registerAppTask('startMediator', '4444', '.localnet/mediator', 'Mediator')
registerAppTask('startAlice', '5555', '.localnet/alice', 'Alice', true)
registerAppTask('startBob', '6666', '.localnet/bob', 'Bob')
