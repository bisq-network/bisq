pluginManagement {
    repositories {
        gradlePluginPortal()
    }
    includeBuild('build-logic')
}

include 'proto'
include 'proto-grpc'
include 'assets'
include 'bridge'
include 'btcnodemonitor'
include 'common'
include 'p2p'
include 'core'
include 'cli'
include 'daemon'
include 'desktop'
include 'inventory'
include 'persistence'
include 'restapi'
include 'seednode'
include 'statsnode'
include 'apitest'
include 'platform'
include 'updater'

includeBuild 'bitcoind'
// tor/ is the Git submodule tor. A clone without its submodules has an empty tor/.
if (!file('tor/settings.gradle.kts').isFile()) {
    throw new GradleException('The Git submodule tor/ is missing. Run: git submodule update --init')
}
includeBuild 'tor'

rootProject.name = 'bisq'
