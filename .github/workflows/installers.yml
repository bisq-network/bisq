name: Build Installers

# Builds the desktop installers the release ships: DEB and RPM on Linux, one DMG per macOS
# architecture and the Windows EXE. jpackage only builds for the host platform, so each installer
# needs its own runner. This checks that the installers build. It does not check reproducibility.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux DEB and RPM
            os: ubuntu-24.04
            artifact: installers-linux-x86_64
            installers: 'bisq_*-1_amd64.deb bisq-*-1.x86_64.rpm'
          - name: macOS Apple Silicon DMG
            os: macos-15
            artifact: installers-macos-aarch64
            installers: 'Bisq-aarch64-*.dmg'
          - name: macOS Intel DMG
            os: macos-15-intel
            artifact: installers-macos-x86_64
            installers: 'Bisq-x86_64-*.dmg'
          - name: Windows EXE
            os: windows-2025
            artifact: installers-windows-x86_64
            installers: 'Bisq-*.exe'
    name: ${{ matrix.name }}, Java 21
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          submodules: 'true'
          persist-credentials: false

    - name: Verify Gradle wrapper checksums
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c gradle/wrapper/gradle-wrapper.sha256
        else
          shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
        fi

    - name: Install Linux packaging tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils \
          cpio \
          dpkg \
          dpkg-dev \
          fakeroot \
          file \
          gzip \
          rpm \
          tar \
          xz-utils \
          zip

    - name: Install WiX Toolset
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
        $wixDirectory = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
          Sort-Object Name -Descending |
          Select-Object -First 1
        if ($null -eq $wixDirectory) {
          throw "WiX Toolset installation directory was not found."
        }
        "$($wixDirectory.FullName)\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'corretto'
        check-latest: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # The cache step below restores Gradle User Home.
        cache-provider: external

    # Restores the cache that build.yml saves on the default branch, so a run does not download every
    # dependency again and hit the Maven Central rate limit. This workflow does not save a cache.
    - name: Restore Gradle cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: build-gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/*.versions.toml') }}
        restore-keys: |
          build-gradle-${{ runner.os }}-${{ runner.arch }}-

    - name: Build installers
      shell: bash
      run: ./gradlew :desktop:generateInstallers --scan

    # The macOS DMG name carries the architecture of the build JVM. Requiring it per job catches a
    # runner that builds for the other architecture.
    - name: Check and stage installers
      shell: bash
      working-directory: desktop/build/packaging
      env:
        INSTALLERS: ${{ matrix.installers }}
        CHECKSUMS: SHA256SUMS-${{ matrix.artifact }}
        JOB_NAME: ${{ matrix.name }}
      run: |
        read -r -a patterns <<< "$INSTALLERS"
        shopt -s nullglob
        installers=()
        for pattern in "${patterns[@]}"; do
          # Expand each pattern only within the packaging directory.
          # shellcheck disable=SC2206
          matches=($pattern)
          if [ ${#matches[@]} -ne 1 ] || [ ! -f "${matches[0]}" ] || [ ! -s "${matches[0]}" ]; then
            echo "::error::Expected one nonempty installer matching ${pattern} in desktop/build/packaging"
            ls -l
            exit 1
          fi
          installers+=("${matches[0]}")
        done
        mkdir -p "$RUNNER_TEMP/installer-upload"
        cp "${installers[@]}" "$RUNNER_TEMP/installer-upload/"
        cd "$RUNNER_TEMP/installer-upload"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "${installers[@]}" > "$CHECKSUMS"
        else
          shasum -a 256 "${installers[@]}" > "$CHECKSUMS"
        fi
        cat "$CHECKSUMS"
        {
          echo "### ${JOB_NAME}"
          echo
          echo "Commit \`${GITHUB_SHA}\`"
          echo
          echo '```'
          cat "$CHECKSUMS"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # Workflow artifacts are for developers only: downloading them needs a GitHub login, no release links to
    # them and they expire after a few days.
    - name: Upload installers
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.artifact }}-${{ github.sha }}
        path: ${{ runner.temp }}/installer-upload/
        if-no-files-found: error
        retention-days: 5
