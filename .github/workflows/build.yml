name: Build Bisq

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ubuntu-24.04, macos-15, windows-2025]
            java: [ '21' ]
    name: Test Java ${{ matrix.java }}, ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          submodules: 'true'
          persist-credentials: false

    - name: Verify Gradle wrapper checksums
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c gradle/wrapper/gradle-wrapper.sha256
        else
          shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
        fi

    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: ${{ matrix.java }}
        distribution: 'corretto'
        check-latest: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # The Gradle cache steps below save and restore Gradle User Home.
        cache-provider: external

    # The basic cache provider of setup-gradle restores only an exact match of the build files. After a change of
    # a build file a job started empty and downloaded every dependency again, which Maven Central rate-limits with
    # HTTP 429. The restore key falls back to the latest cache of the runner. Like setup-gradle, only pushes to the
    # default branch save.
    - name: Restore Gradle cache
      id: gradle-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: build-gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/*.versions.toml') }}
        restore-keys: |
          build-gradle-${{ runner.os }}-${{ runner.arch }}-

    - name: Build with Gradle
      shell: bash
      run: ./gradlew verifyReleaseBuild --scan

    - name: Stop Gradle before saving its cache
      if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && steps.gradle-cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./gradlew --stop

    - name: Save Gradle cache
      if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && steps.gradle-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

    - name: Upload release manifests
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-manifests-${{ matrix.os }}-java-${{ matrix.java }}
        path: |
          build/reports/release/SHA256SUMS
          build/reports/release/release-manifest.tsv
          build/reports/release/build-info.json
          build/reports/release/release-evidence.zip
        if-no-files-found: error
