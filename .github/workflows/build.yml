name: Build Bisq

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # A repository can set BUILD_ON_PUSH to false to build pull requests only and avoid a second run per commit.
    if: github.event_name != 'push' || vars.BUILD_ON_PUSH != 'false'
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            # A repository can set BUILD_LINUX_ONLY to true to build on Ubuntu only. The variable only selects one of
            # the two checked-in runner lists, so every runner label stays reviewed and verified.
            os: ${{ fromJSON(vars.BUILD_LINUX_ONLY == 'true' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15", "windows-2025"]') }}
            java: [ '21.0.6' ]
    name: Test Java ${{ matrix.java }}, ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          submodules: 'true'
          persist-credentials: false

    - name: Verify Gradle wrapper checksums
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c gradle/wrapper/gradle-wrapper.sha256
        else
          shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
        fi

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: ${{ matrix.java }}
        distribution: 'zulu'
        check-latest: false

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      with:
        arguments: verifyReleaseBuild --scan

    - name: Upload release manifests
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-manifests-${{ matrix.os }}-java-${{ matrix.java }}
        path: |
          build/reports/release/SHA256SUMS
          build/reports/release/release-manifest.tsv
          build/reports/release/build-info.json
          build/reports/release/release-evidence.zip
        if-no-files-found: error
