name: Installer Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-installer-evidence:
    name: Linux installer evidence, Java 21
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          submodules: 'true'
          persist-credentials: false

    - name: Verify Gradle wrapper checksums
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c gradle/wrapper/gradle-wrapper.sha256
        else
          shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
        fi

    - name: Install Linux packaging tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils \
          cpio \
          dpkg \
          dpkg-dev \
          fakeroot \
          file \
          gzip \
          rpm \
          tar \
          xz-utils \
          zip

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'zulu'
        check-latest: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic

    - name: Build Linux installer evidence
      shell: bash
      run: ./gradlew verifyInstallerEvidenceBundle --scan

    - name: Upload Linux installer evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: installer-evidence-ubuntu-24.04-java-21
        path: |
          build/reports/release/INSTALLER-SHA256SUMS
          build/reports/release/installer-manifest.tsv
          build/reports/release/installer-build-info.json
          build/reports/release/installer-structure-summary.txt
          build/reports/release/installer-structure-report.tsv
          build/reports/release/installer-structure/**
          build/reports/release/installer-evidence.zip
        if-no-files-found: error

  macos-installer-evidence:
    name: macOS installer evidence, Java 21
    runs-on: macos-15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          submodules: 'true'
          persist-credentials: false

    - name: Verify Gradle wrapper checksums
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c gradle/wrapper/gradle-wrapper.sha256
        else
          shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
        fi

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'zulu'
        check-latest: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic

    - name: Build macOS installer evidence
      shell: bash
      run: ./gradlew verifyInstallerEvidenceBundle --scan

    - name: Upload macOS installer evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: installer-evidence-macos-15-java-21
        path: |
          build/reports/release/INSTALLER-SHA256SUMS
          build/reports/release/installer-manifest.tsv
          build/reports/release/installer-build-info.json
          build/reports/release/installer-structure-summary.txt
          build/reports/release/installer-structure-report.tsv
          build/reports/release/installer-structure/**
          build/reports/release/installer-evidence.zip
        if-no-files-found: error

  windows-installer-evidence:
    name: Windows installer evidence, Java 21
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          submodules: 'true'
          persist-credentials: false

    - name: Verify Gradle wrapper checksums
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c gradle/wrapper/gradle-wrapper.sha256
        else
          shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
        fi

    - name: Install WiX Toolset
      shell: pwsh
      run: |
        choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
        $wixDirectory = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
          Sort-Object Name -Descending |
          Select-Object -First 1
        if ($null -eq $wixDirectory) {
          throw "WiX Toolset installation directory was not found."
        }
        "$($wixDirectory.FullName)\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'zulu'
        check-latest: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic

    - name: Build Windows installer evidence
      shell: bash
      run: ./gradlew verifyInstallerEvidenceBundle --scan

    - name: Upload Windows installer evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: installer-evidence-windows-2025-java-21
        path: |
          build/reports/release/INSTALLER-SHA256SUMS
          build/reports/release/installer-manifest.tsv
          build/reports/release/installer-build-info.json
          build/reports/release/installer-structure-summary.txt
          build/reports/release/installer-structure-report.tsv
          build/reports/release/installer-structure/**
          build/reports/release/installer-evidence.zip
        if-no-files-found: error
