version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/apitest/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The e2e images run the Bisq daemon, which needs Java 21.
      - dependency-name: "amazoncorretto"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/docker/release-builder/linux"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Keep the release tools on Ubuntu 24.04 with the existing apt snapshot.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/build-logic/docker-image-builder/src/main/resources"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "amazoncorretto"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
