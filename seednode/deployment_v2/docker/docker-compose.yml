version: '3.7'

services:
    bisq-bitcoind:
        image: bisq/bitcoind:latest
        deploy:
            replicas: 1
            restart_policy:
                condition: any
        ports:
            - 8333:8333 # bitcoind port
        volumes:
            - ./bitcoind_data_dir:/root/.bitcoin
            - ./blocknotify.sh:/blocknotify.sh
        command:
            - -server=1
            - -listen=1
            - -discover=1
            - -txindex=1
            - -dbcache=1337
            - -maxconnections=1337
            - -peerbloomfilters=1
            - -rpcallowip=127.0.0.1
            - -rpcallowip=172.0.0.1/8 # Docker IP range
            - -rpcuser=bisq
            - -rpcpassword=bisq
            - -blocknotify=/blocknotify.sh %s
            - -bind=0.0.0.0:8332
            - -rpcbind=0.0.0.0:8332

    # The node starts its own Tor in this container: Tor reaches the onion service of the node only on the loopback of
    # the node, and the services of a Swarm stack cannot share a network namespace. The node runs Tor in its sandbox; if
    # the container cannot enforce the sandbox, the start fails, and useTorSandbox=false in seednode_config runs Tor
    # without it.
    bisq-seednode:
        image: bisq/seednode:latest
        environment:
            - JDK_JAVA_OPTIONS=-Xms4096M -Xmx4096M -XX:+ExitOnOutOfMemoryError
        configs:
            - bisq_seednode_config
        deploy:
            replicas: 1
            restart_policy:
                condition: any
        ports:
            - 8000:8000 # bisq node port
        volumes:
            - bisq_seednode_data:/bisq/bisq-seednode
        command:
            - --configFile=/bisq_seednode_config

configs:
    bisq_seednode_config:
        file: ./seednode_config

volumes:
    bisq_seednode_data:
