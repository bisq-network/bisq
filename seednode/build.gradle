plugins {
    id 'bisq.application'
    id 'bisq.javafx'
    id 'bisq.gradle.app_start_plugin.AppStartPlugin'
    id 'bisq.gradle.docker.image_builder.DockerImageBuilderPlugin'
}

application {
    mainClass = 'bisq.seednode.SeedNodeMain'
    applicationDefaultJvmArgs = ['-XX:+ExitOnOutOfMemoryError', '-Xms4096M', '-Xmx4096M',
                                 '-Djava.net.preferIPv4Stack=true']
}

javafx {
    modules = ['javafx.base']
}

distTar.enabled = true

dependencies {
    implementation enforcedPlatform(project(':platform'))
    implementation project(':common')
    implementation project(':proto')
    implementation project(':assets')
    implementation project(':p2p')
    implementation project(':core')
    implementation libs.protobuf.java
    annotationProcessor libs.lombok
    compileOnly libs.lombok
    implementation libs.slf4j.api
    implementation(libs.google.guice) {
        exclude(module: 'guava')
    }
    // SeedNodeSystemdUnitTest parses the external_tor.config which bisq.service writes as the Tor library does
    testImplementation 'tor:tor'
}

def registerSeedNodeTask(String taskName, String nodePort, String rpcPort, String appName) {
    tasks.register(taskName, JavaExec) {
        group = 'application'
        dependsOn ':initialDaoSetup'

        classpath = sourceSets.main.runtimeClasspath
        mainClass = application.mainClass
        jvmArgs = application.applicationDefaultJvmArgs
        workingDir = rootProject.projectDir

        args = [
            "--baseCurrencyNetwork=BTC_REGTEST",
            "--useLocalhostForP2P=true",
            "--useDevPrivilegeKeys=true",
            "--nodePort=${nodePort}",

            "--fullDaoNode=true",
            "--isBmFullNode=true",

            "--rpcUser=bisqdao",
            "--rpcPassword=bsq",
            "--rpcBlockNotificationPort=${rpcPort}",

            "--userDataDir=.localnet",
            "--appName=${appName}"
        ]
    }
}

registerSeedNodeTask('firstSeedNode', '2002', '5120', 'seednode')
registerSeedNodeTask('secondSeedNode', '3002', '5121', 'seednode2')
