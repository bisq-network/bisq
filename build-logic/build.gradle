import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// The dependency audit of the Bisq build cannot reach the projects of an included build, so this task resolves the
// configurations of build-logic for it (resolveAndVerifyDependencies in ../build.gradle). Gradle verifies their
// artifacts with the verification metadata of the Bisq build. The task writes the resolved modules to an inventory in
// the format of the inventories of Bisq 2, from which dependencySignatureReport of the Bisq build lists them.
tasks.register('resolveAndVerifyDependencies') {
    group = 'verification'
    description = 'Resolves every resolvable configuration of build-logic for dependency verification.'

    // Resolving every configuration of every project needs the project model while the task runs.
    // The configuration cache does not allow that, so it is turned off for this task.
    notCompatibleWithConfigurationCache('Resolves all project configurations at execution time')

    doLast {
        def configurations = allprojects.collectMany { project ->
            (project.configurations + project.buildscript.configurations).findAll { it.canBeResolved }
        }
        def resolvedComponents = new TreeSet<String>()
        def directComponents = new TreeSet<String>()
        configurations.each { configuration ->
            def result = configuration.incoming.resolutionResult
            result.root.dependencies.each { dependency ->
                def selected = dependency.hasProperty('selected') ? dependency.selected?.id : null
                if (selected instanceof ModuleComponentIdentifier) {
                    directComponents.add("${selected.group}:${selected.module}:${selected.version}".toString())
                }
            }
            result.allComponents.each { component ->
                def id = component.id
                if (id instanceof ModuleComponentIdentifier) {
                    resolvedComponents.add("${id.group}:${id.module}:${id.version}".toString())
                }
            }
            configuration.resolve()
        }

        def inventoryFile = file('.gradle/dependency-verification/inventory.tsv')
        inventoryFile.parentFile.mkdirs()
        def lines = ["configurations\t${configurations.size()}".toString()] + resolvedComponents.collect { id ->
            "${directComponents.contains(id) ? 'direct' : 'transitive'}\t${id}".toString()
        }
        inventoryFile.setText(lines.join('\n') + '\n', 'UTF-8')
        logger.lifecycle("Resolved and verified ${configurations.size()} configurations in build-logic.")
    }
}
