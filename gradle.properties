systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Maven Central answers bursts from a shared address, such as a CI runner, with HTTP 429. By default Gradle tries a
# download 3 times within 3 s. Try 4 times and wait 15, 30 and 60 s in between. These are internal properties of the
# Gradle 9.0 dependency resolution (ErrorHandlingModuleComponentRepository); check them after a Gradle update.
systemProp.org.gradle.internal.repository.max.tentatives=4
systemProp.org.gradle.internal.repository.initial.backoff=15000

# The build cache is not enabled here. Restored task outputs are not covered by dependency
# verification and hide non-determinism when two release builds are compared. Developers can enable it
# for their own builds with org.gradle.caching=true in ~/.gradle/gradle.properties.
org.gradle.configuration-cache=true

# Makes Y/N user prompts more readable during installer packaging
org.gradle.console=plain
org.gradle.dependency.verification.console=verbose

# Minimum Java version (Amazon Corretto). Every Corretto build of the same feature version at or above it passes.
releaseBuild.javaVersion=21.0.13.1
releaseBuild.javaVendor=Amazon.com Inc.
releaseBuild.gradleVersion=9.0.0

# Consistent character set and locale across all builds.
systemProp.file.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US
systemProp.user.variant=
