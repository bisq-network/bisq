systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

org.gradle.caching=true
org.gradle.configuration-cache=true

# Makes Y/N user prompts more readable during installer packaging
org.gradle.console=plain
org.gradle.dependency.verification.console=verbose

# Minimum Java version (Azul Zulu). Every Azul build of the same feature version at or above it passes.
releaseBuild.javaVersion=21.0.13.0.3
releaseBuild.javaVendor=Azul Systems, Inc.
releaseBuild.gradleVersion=9.0.0

# Consistent character set and locale across all builds.
systemProp.file.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US
systemProp.user.variant=
