plugins {
    id 'bisq.java-conventions'
    id 'bisq.java-integration-tests'
    id 'bisq.javafx'
}

javafx {
    modules = ['javafx.base']
}

dependencies {
    implementation enforcedPlatform(project(':platform'))
    implementation project(':proto')
    implementation project(':common')
    annotationProcessor libs.lombok
    compileOnly libs.lombok
    implementation libs.google.guava
    implementation libs.fxmisc.easybind
    implementation libs.jetbrains.annotations
    implementation libs.slf4j.api
    implementation 'tor:tor'
    // The constructor of TorTransportConfig takes DirectoryAuthority of tor-common, which tor does not export.
    implementation 'tor:tor-common'
    implementation(libs.bitcoinj) {
        exclude(module: 'bcprov-jdk15on')
        exclude(module: 'guava')
        exclude(module: 'jsr305')
        exclude(module: 'okhttp')
        exclude(module: 'okio')
        exclude(module: 'slf4j-api')
    }
    implementation(libs.google.guice) {
        exclude(module: 'guava')
    }
    implementation(libs.apache.httpclient) {
        exclude(module: 'commons-codec')
    }
    testAnnotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testImplementation libs.logback.classic
    testImplementation libs.logback.core
    testImplementation libs.apache.commons.lang3
    // The Tor node test runs the nodes on a private Tor network on this host
    integrationTestImplementation 'tor:tor-local-network'
}
